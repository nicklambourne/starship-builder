name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    # Deploys only ever run on trusted refs (push to main / manual dispatch),
    # so this can always take the self-hosted runner when one is configured.
    # See ci.yml for the fork-PR reasoning behind the fallback chain.
    runs-on: ${{ vars.SELF_HOSTED_RUNNER || 'ubuntu-latest' }}
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    # Kept on a GitHub-hosted runner: this job only calls the Pages deployment
    # API, and keeping it off the LAN cluster means a runner outage cannot
    # strand a deployment.
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
